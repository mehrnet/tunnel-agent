[package]
name = "tunnel-agent"
version = "0.5.0"
edition = "2024"
rust-version = "1.88"
description = "Low-footprint multi-transport tunnel runtime"
repository = "https://github.com/mehrnet/tunnel-agent"

[lints]
workspace = true

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["macros", "process", "rt", "signal", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
flate2 = "1.1"
tar = "0.4"
