name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build static binary
        run: cross build --locked --release --target "$TARGET"
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TUNNEL_AGENT_VERSION: ${{ github.ref_name }}
      - name: Package release asset
        run: |
          cp "target/${TARGET}/release/tunnel-agent" "tunnel-agent-${TARGET}"
          sha256sum "tunnel-agent-${TARGET}" > "tunnel-agent-${TARGET}.sha256"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tunnel-agent-${{ matrix.target }}
          path: tunnel-agent-*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
