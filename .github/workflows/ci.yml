name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: node tools/check-policy.mjs
      - run: npm ci
        working-directory: tunnel-api
      - run: npm run check
        working-directory: tunnel-api
      - run: npm run web:check
        working-directory: tunnel-api
      - run: npm run web:build
        working-directory: tunnel-api
      - run: npm run quality
        working-directory: tunnel-api
      - run: node --test test/*.cjs
        working-directory: tunnel-api
      - run: npm exec -- wrangler deploy --dry-run
        working-directory: tunnel-api
      - run: npm exec -- wrangler deploy --dry-run --config ../tunnel-files/wrangler.jsonc
        working-directory: tunnel-api
      - run: shellcheck tunnel-files/static/install.sh tools/*.sh

